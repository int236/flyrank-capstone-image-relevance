name: image-relevance-autotagging

run: uvicorn app.api:app --reload

seed: python -m app.seed

test: pytest tests/ -v

base_url: http://127.0.0.1:8000

endpoints:
  - method: GET
    path: /
    expected_status: 200

  - method: GET
    path: /health
    expected_status: 200

  - method: POST
    path: /batch/classify
    expected_status: 200

  - method: GET
    path: /cost
    expected_status: 200

  - method: GET
    path: /posts/1/images
    expected_status: 200

  - method: GET
    path: /review
    expected_status: 200

docs:
  swagger: /docs
  redoc: /redoc

notes:
  - Vision calls are cost-tracked.
  - Embeddings use local TF-IDF (no external API cost).
  - Requires GEMINI_API_KEY before running.